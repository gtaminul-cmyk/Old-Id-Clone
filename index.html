<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050515; /* Deep Cyberpunk Space Background */
            cursor: pointer;
        }
        #nexus-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
        }
        .watermark {
            position: absolute;
            bottom: 20px;
            right: 20px;
            color: rgba(0, 242, 254, 0.4); /* Neon Cyan Watermark */
            font-family: 'JetBrains Mono', monospace, sans-serif;
            font-size: 11px;
            letter-spacing: 2px;
            pointer-events: none;
            user-select: none;
            text-shadow: 0 0 8px rgba(0, 242, 254, 0.4);
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <canvas id="nexus-canvas"></canvas>
    <div class="watermark">DARKNET • NEXUS GRAPH</div>

    <script>
        (function() {
            const scene = new THREE.Scene();
            scene.background = new THREE.Color(0x050515);

            const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 1, 22);

            const renderer = new THREE.WebGLRenderer({
                canvas: document.getElementById('nexus-canvas'),
                antialias: true,
                alpha: false
            });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

            // --- ENHANCED DYNAMIC PARTICLES ---
            const particleCount = 6500; // Slightly increased density for better visuals
            const particlesGeo = new THREE.BufferGeometry();
            const posArray = new Float32Array(particleCount * 3);
            const colorArray = new Float32Array(particleCount * 3);
            
            for(let i = 0; i < particleCount; i++) {
                const shape = Math.random();
                let radius, theta, phi;
                
                if(shape < 0.4) {
                    // Spiral arms
                    const arm = Math.floor(Math.random() * 3);
                    const t = Math.random() * Math.PI * 4;
                    radius = 5 + t * 1.5;
                    theta = t * 0.8 + arm * 2;
                    phi = Math.sin(t) * 0.5;
                } else if(shape < 0.7) {
                    // Torus
                    const R = 12;
                    const r = 4;
                    const u = Math.random() * Math.PI * 2;
                    const v = Math.random() * Math.PI * 2;
                    radius = R + r * Math.cos(v);
                    theta = u;
                    phi = Math.PI/2 + (r * Math.sin(v)) / R;
                } else {
                    // Halo
                    radius = 15 + Math.random() * 10;
                    theta = Math.random() * Math.PI * 2;
                    phi = Math.acos((Math.random() * 2) - 1);
                }
                
                posArray[i*3] = radius * Math.cos(theta) * Math.sin(phi);
                posArray[i*3+1] = radius * Math.sin(theta) * Math.sin(phi) * 0.6;
                posArray[i*3+2] = radius * Math.cos(phi);
                
                // --- NEW UNIQUE PREMIUM COLOR SCHEME ---
                const rand = Math.random();
                let color;
                if(rand < 0.35) color = new THREE.Color(0x00f2fe);      // Neon Cyan
                else if(rand < 0.65) color = new THREE.Color(0x9b51e0); // Electric Purple
                else if(rand < 0.85) color = new THREE.Color(0x10b981); // Emerald Green
                else color = new THREE.Color(0xf59e0b);                 // Cyber Gold
                
                colorArray[i*3] = color.r;
                colorArray[i*3+1] = color.g;
                colorArray[i*3+2] = color.b;
            }
            
            particlesGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
            particlesGeo.setAttribute('color', new THREE.BufferAttribute(colorArray, 3));

            // High glow particle texture
            const canvas = document.createElement('canvas');
            canvas.width = 32;
            canvas.height = 32;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = 'white';
            ctx.beginPath();
            ctx.arc(16, 16, 7, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowColor = '#00f2fe';
            ctx.shadowBlur = 12;
            const particleTexture = new THREE.CanvasTexture(canvas);

            const particlesMat = new THREE.PointsMaterial({
                size: 0.20, // Slightly sharper
                vertexColors: true,
                map: particleTexture,
                transparent: true,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });

            const particleSystem = new THREE.Points(particlesGeo, particlesMat);
            scene.add(particleSystem);

            // --- DYNAMIC NETWORK LINES ---
            const lineGroup = new THREE.Group();
            for(let j = 0; j < 65; j++) {
                const points = [];
                const segments = 30;
                const startAngle = Math.random() * Math.PI * 2;
                
                for(let i = 0; i <= segments; i++) {
                    const t = i / segments;
                    const angle = startAngle + t * Math.PI * 2;
                    const r = 10 + Math.sin(t * Math.PI * 6) * 5;
                    
                    const x = Math.cos(angle) * r;
                    const y = Math.sin(angle * 2) * 4 + Math.cos(t * Math.PI * 4) * 3;
                    const z = Math.sin(angle) * r * 0.7;
                    
                    points.push(new THREE.Vector3(x, y, z));
                }
                
                const lineGeo = new THREE.BufferGeometry().setFromPoints(points);
                const lineMat = new THREE.LineBasicMaterial({ 
                    color: Math.random() > 0.5 ? 0x00f2fe : 0x9b51e0, // Cyan & Purple Lines
                    transparent: true,
                    opacity: 0.08 // Slightly more visible for network look
                });
                const line = new THREE.Line(lineGeo, lineMat);
                lineGroup.add(line);
            }
            scene.add(lineGroup);

            // --- CENTRAL DATA CORE ---
            const coreGeo = new THREE.IcosahedronGeometry(2.8, 2);
            const coreMat = new THREE.MeshPhongMaterial({
                color: 0x00f2fe,
                emissive: 0x240046,
                wireframe: true,
                transparent: true,
                opacity: 0.25
            });
            const core = new THREE.Mesh(coreGeo, coreMat);
            scene.add(core);

            // Inner core glow
            const innerCoreGeo = new THREE.SphereGeometry(1.5, 32);
            const innerCoreMat = new THREE.MeshBasicMaterial({
                color: 0x9b51e0, // Purple core inner glow
                transparent: true,
                opacity: 0.15
            });
            const innerCore = new THREE.Mesh(innerCoreGeo, innerCoreMat);
            scene.add(innerCore);

            // --- FLOATING BINARY SPRITES ---
            const binaryGroup = new THREE.Group();
            const binaryCount = 220;
            for(let i = 0; i < binaryCount; i++) {
                const canvas = document.createElement('canvas');
                canvas.width = 64;
                canvas.height = 64;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = Math.random() > 0.5 ? '#00f2fe' : '#9b51e0';
                ctx.font = 'bold 34px monospace';
                ctx.fillText(Math.random() > 0.5 ? '1' : '0', 15, 45);
                
                const texture = new THREE.CanvasTexture(canvas);
                const material = new THREE.SpriteMaterial({ 
                    map: texture, 
                    transparent: true,
                    opacity: 0.15,
                    blending: THREE.AdditiveBlending
                });
                const sprite = new THREE.Sprite(material);
                
                const r = 9 + Math.random() * 8;
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos((Math.random() * 2) - 1);
                
                sprite.position.x = r * Math.sin(phi) * Math.cos(theta);
                sprite.position.y = r * Math.sin(phi) * Math.sin(theta) * 0.7;
                sprite.position.z = r * Math.cos(phi);
                
                sprite.scale.set(1, 1, 1);
                binaryGroup.add(sprite);
            }
            scene.add(binaryGroup);

            // Lights
            const light1 = new THREE.PointLight(0x00f2fe, 1.2, 40);
            light1.position.set(5, 5, 10);
            scene.add(light1);
            
            const light2 = new THREE.PointLight(0x9b51e0, 0.9, 40);
            light2.position.set(-8, -3, 10);
            scene.add(light2);
            
            const ambient = new THREE.AmbientLight(0x0a0a23);
            scene.add(ambient);

            // Mouse interaction
            let mouseX = 0, mouseY = 0;
            let targetX = 0, targetY = 0;
            let mouseActiveAmount = 0.0;

            document.addEventListener('mousemove', (e) => {
                mouseX = (e.clientX / window.innerWidth - 0.5) * 12;
                mouseY = -(e.clientY / window.innerHeight - 0.5) * 8;
                mouseActiveAmount = 1.0;
            });

            document.addEventListener('touchmove', (e) => {
                if (e.touches && e.touches[0]) {
                    mouseX = (e.touches[0].clientX / window.innerWidth - 0.5) * 12;
                    mouseY = -(e.touches[0].clientY / window.innerHeight - 0.5) * 8;
                    mouseActiveAmount = 1.0;
                }
            }, { passive: true });

            // Animation loop
            let time = 0;
            function animate() {
                requestAnimationFrame(animate);
                
                time += 0.002;

                particleSystem.rotation.y += 0.0008;
                particleSystem.rotation.x += Math.sin(time * 0.3) * 0.0003;
                
                lineGroup.rotation.y += 0.0006;
                lineGroup.rotation.x += Math.sin(time * 0.2) * 0.0004;
                
                const scale = 1 + Math.sin(time * 3) * 0.1;
                core.scale.set(scale, scale, scale);
                innerCore.scale.set(scale * 0.8, scale * 0.8, scale * 0.8);
                
                binaryGroup.rotation.y += 0.0004;
                binaryGroup.rotation.x += Math.sin(time * 0.5) * 0.0002;
                
                mouseActiveAmount += (0 - mouseActiveAmount) * 0.03;

                const autoX = Math.sin(time * 0.6) * 6;
                const autoY = Math.cos(time * 0.4) * 3;

                targetX = (mouseX * mouseActiveAmount) + (autoX * (1 - mouseActiveAmount));
                targetY = (mouseY * mouseActiveAmount) + (autoY * (1 - mouseActiveAmount));

                camera.position.x += (targetX - camera.position.x) * 0.05;
                camera.position.y += (targetY - camera.position.y) * 0.05;
                camera.lookAt(0, 0, 0);

                renderer.render(scene, camera);
            }

            animate();

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        })();
    </script>
</body>
</html>
